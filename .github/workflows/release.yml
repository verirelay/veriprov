name: release

# Publishes the container image to GHCR.
#
# Tag conventions:
#   sha-<full commit>  immutable identity, pushed by every build
#   <version>          formal release tag, pushed with the tag
#   latest             moves only on a formal release, never overwritten by an
#                      arbitrary build
#
# The digest (ghcr.io/...@sha256:...) is what identifies a deployment; a tag is
# only an index. The release records the digest and signs it with cosign
# keyless; the signature travels with the image in the registry, and verifiers
# need no GitHub account and no credentials beyond pull access.
#
# Base images are pinned by digest in the Dockerfile; the sha-<commit> tag
# depends on it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag used as the release tag and the image version tag, for example v0.1.0
        required: true
      promote_latest:
        description: Whether to point latest at this build (formal releases only)
        type: boolean
        default: false

permissions:
  contents: write           # create the release
  packages: write           # push to GHCR
  id-token: write           # cosign keyless and artifact attestation (OIDC -> Fulcio)
  attestations: write       # GitHub artifact attestation
  artifact-metadata: write  # storage record of the attested image

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      PROMOTE_LATEST: ${{ github.event_name == 'push' || inputs.promote_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: resolve source identity
        id: source
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          dirty="$(git status --porcelain)"
          if [[ -n "$dirty" ]]; then
            echo "error: release must build from a clean working tree; uncommitted changes:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "commit:  $commit"
          echo "release: $RELEASE_TAG (promote_latest=$PROMOTE_LATEST)"

      # The builder is pinned by digest as well: the default
      # moby/buildkit:buildx-stable-1 is a floating tag, and switching builders
      # changes the index digest of identical content. Pinned builder + same
      # commit yields the same digest.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name must be all lowercase; the tag list is emitted via a
      # heredoc so multiple lines are preserved.
      - name: resolve image tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit="${{ steps.source.outputs.commit }}"
          tags="${image}:sha-${commit}"
          if [[ "$PROMOTE_LATEST" == "true" ]]; then
            tags="${tags}"$'\n'"${image}:${RELEASE_TAG}"$'\n'"${image}:latest"
          fi
          {
            echo "image=$image"
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "pushing tags:"
          printf '  %s\n' "$tags"

      # Immutability guard: refuse to publish when sha-<commit> already exists,
      # so a rerun cannot silently re-point it at a different digest.
      - name: guard against re-pointing an existing sha tag
        run: |
          set -euo pipefail
          ref="${{ steps.meta.outputs.image }}:sha-${{ steps.source.outputs.commit }}"
          if existing="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "error: ${ref} already exists (digest ${existing})" >&2
            echo "The image for a commit must not be overwritten. To rebuild, delete the tag first (requires delete:packages permission)." >&2
            exit 1
          fi
          echo "${ref} does not exist yet; safe to publish"

      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Do not use BuildKit's provenance/sbom inputs: they bake attestations
          # into the image index, giving identical content a different index
          # digest on every build, and sha-<commit> would no longer be an
          # immutable identity. Provenance is attached as OCI referrers instead
          # (cosign sign / attest below); referrers do not affect the digest.
          provenance: false
          sbom: false

      - name: report digest
        run: |
          set -euo pipefail
          echo "image digest: ${{ steps.build.outputs.digest }}"
          echo "pull with:    docker pull ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign-installer has no floating v4 tag; pin an exact release.
          cosign-release: 'v3.1.4'

      # Sign by digest (tags move, digests do not). The bundle is stored in the
      # release for offline review.
      - name: sign image (keyless)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          ref="${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes \
            --bundle "$RUNNER_TEMP/out/image.cosign.bundle" \
            "$ref"
          ls -l "$RUNNER_TEMP/out"

      # The GitHub artifact attestation is pushed as an OCI referrer as well,
      # so it leaves the image digest unchanged.
      - name: attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The SBOM is attached as a separate OCI referrer (it does not change the
      # image digest): syft generates SPDX, cosign attest hangs it on the
      # pushed digest.
      - name: generate sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/out/sbom.spdx.json
          artifact-name: ''
          upload-release-assets: false

      - name: attach sbom as oci referrer
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type spdxjson \
            --predicate "$RUNNER_TEMP/out/sbom.spdx.json" \
            "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      # Self-check: the signature is verified here, not left to manual review.
      - name: verify signature (self-check)
        run: |
          set -euo pipefail
          identity='^https://github\.com/'"${GITHUB_REPOSITORY}"'/\.github/workflows/release\.yml@'
          cosign verify "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # Record the sha256 of the binary inside the image: unlike the index
      # digest, it is builder-independent and comparable across environments.
      - name: extract binary digest from pushed image
        id: content
        run: |
          set -euo pipefail
          ref="${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          cid="$(docker create "$ref")"
          docker cp "$cid:/veriprov" "$RUNNER_TEMP/out/veriprov-from-image"
          docker rm "$cid" >/dev/null
          bin_digest="$(sha256sum "$RUNNER_TEMP/out/veriprov-from-image" | cut -d' ' -f1)"
          echo "binary_sha256=$bin_digest" >> "$GITHUB_OUTPUT"
          echo "sha256 of /veriprov inside the image: $bin_digest"

      - name: write component build report
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          # The base image digests are read straight from the Dockerfile so the
          # report always matches the pins actually used.
          base_build="$(sed -nE 's/^FROM[[:space:]]+([^[:space:]]+)[[:space:]]+AS[[:space:]]+build$/\1/p' Dockerfile)"
          base_run="$(sed -nE '/^FROM /{/AS build/!s/^FROM[[:space:]]+([^[:space:]]+)$/\1/p}' Dockerfile)"
          jq -n \
            --arg commit "${{ steps.source.outputs.commit }}" \
            --arg tag "$RELEASE_TAG" \
            --arg image "${{ steps.meta.outputs.image }}" \
            --arg digest "${{ steps.build.outputs.digest }}" \
            --arg tags "${{ steps.meta.outputs.tags }}" \
            --arg base_build "$base_build" \
            --arg base_run "$base_run" \
            --arg bin_digest "${{ steps.content.outputs.binary_sha256 }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              version: "verirelay-component-build/1",
              component: "veriprov",
              repository: "https://github.com/verirelay/veriprov",
              commit: $commit,
              release_tag: $tag,
              image: {
                name: $image,
                digest: $digest,
                tags: ($tags | split("\n")),
                platforms: ["linux/amd64"],
                base_images: { build: $base_build, runtime: $base_run },
                binary_sha256: $bin_digest,
                provenance: {
                  cosign: "keyless",
                  sbom: "sbom.spdx.json (attached as an OCI referrer; does not change the image digest)",
                  reproducible_digest: true
                }
              },
              build: { runner: "ubuntu-24.04", workflow_run: $run_url }
            }' > "$out/veriprov-component-build.json"

          ( cd "$out" && sha256sum veriprov-component-build.json image.cosign.bundle sbom.spdx.json > SHA256SUMS )
          cat "$out/veriprov-component-build.json"
          cat "$out/SHA256SUMS"

      # The release assets published below.
      - name: attest release asset provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/out/veriprov-component-build.json
            ${{ runner.temp }}/out/SHA256SUMS
            ${{ runner.temp }}/out/image.cosign.bundle
            ${{ runner.temp }}/out/sbom.spdx.json

      # Archive before publishing: even if the release step fails, the evidence
      # is preserved.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.run_id }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

      - name: write release notes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          img="${{ steps.meta.outputs.image }}"
          digest="${{ steps.build.outputs.digest }}"
          commit="${{ steps.source.outputs.commit }}"
          identity='^https://github\.com/'"${GITHUB_REPOSITORY}"'/\.github/workflows/release\.yml@'
          extra=""
          if [[ "$PROMOTE_LATEST" == "true" ]]; then extra=", \`${RELEASE_TAG}\`, \`latest\`"; fi
          notes="$out/RELEASE_NOTES.md"

          # The static part uses a quoted heredoc (backticks/backslashes stay
          # literal); interpolation points are replaced by placeholders.
          cat > "$notes" <<'STATIC'
          The container image is published to GHCR.

          ```
          docker pull @IMAGE_REF@
          ```

          - Immutable identity: `@DIGEST@` (deploy and measure by digest, not by tag)
          - Tags: `sha-@COMMIT@`@EXTRA@

          **Reproducibility**: the image digest is stable for the same commit +
          the same Dockerfile. BuildKit's `provenance`/`sbom` inputs bake
          attestations into the image index and give identical content a
          different digest on every build, so the signature and SBOM are
          attached as OCI referrers instead; referrers do not affect the image
          digest. Re-running the release for the same commit fails the
          immutability guard instead of silently re-pointing `sha-<commit>`.

          Verify the signature (Fulcio short-lived certificate + Rekor
          transparency log):

          ```
          cosign verify @IMAGE_REF@ \
            --certificate-identity-regexp '@IDENTITY@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ```

          Verify the SBOM (attached as a referrer; also published in this
          release as `sbom.spdx.json`):

          ```
          cosign verify-attestation @IMAGE_REF@ \
            --type spdxjson \
            --certificate-identity-regexp '@IDENTITY@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ```

          Verify the GitHub artifact attestation of the image (the release
          assets have one too):

          ```
          gh attestation verify oci://@IMAGE_REF@ \
            --repo @REPO@ \
            --signer-workflow @REPO@/.github/workflows/release.yml
          ```
          STATIC

          python3 - "$notes" "$img" "$digest" "$commit" "$extra" "$identity" "$GITHUB_REPOSITORY" <<'PYEOF'
          import sys
          path, img, digest, commit, extra, identity, repo = sys.argv[1:8]
          text = open(path, encoding="utf-8").read()
          text = text.replace("@IMAGE_REF@", f"{img}@{digest}")
          text = text.replace("@DIGEST@", digest)
          text = text.replace("@COMMIT@", commit)
          text = text.replace("@EXTRA@", extra)
          text = text.replace("@IDENTITY@", identity)
          text = text.replace("@REPO@", repo)
          open(path, "w", encoding="utf-8").write(text)
          PYEOF
          cat "$notes"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/out/RELEASE_NOTES.md" \
            "$RUNNER_TEMP"/out/veriprov-component-build.json \
            "$RUNNER_TEMP"/out/SHA256SUMS \
            "$RUNNER_TEMP"/out/image.cosign.bundle \
            "$RUNNER_TEMP"/out/sbom.spdx.json
